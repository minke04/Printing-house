<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      
      <!-- Glavna kartica -->
      <div class="card shadow border-0 rounded-4 p-4 p-md-5 bg-white">
        
        <!-- Naslov i opis -->
        <div class="text-center mb-4">
          <h2 class="h3 fw-bold text-dark">Nova lozinka</h2>
          <p class="text-muted small">Unesite novu bezbednu lozinku za vaš nalog.</p>
        </div>

        <!-- Poruka o uspehu/grešci -->
        @if (message) {
          <div class="alert alert-info rounded-3 p-3 mb-4 shadow-sm" role="alert">
            <div class="small">{{ message }}</div>
          </div>
        }

        <!-- Forma sa form-floating elementima -->
        <form (submit)="$event.preventDefault(); submitNewPassword()">
          
          <div class="form-floating mb-3">
            <input 
              type="password" 
              class="form-control rounded-3" 
              id="newPasswordInput"
              [(ngModel)]="newPassword" 
              name="newPassword" 
              placeholder="Nova lozinka" 
              required
            >
            <label for="newPasswordInput">Nova lozinka</label>
          </div>

          <button type="submit" class="btn btn-success w-100 py-3 rounded-3 fw-semibold shadow-sm mb-3">
            Sačuvaj novu lozinku
          </button>
        </form>

        <!-- Povratak na prijavu -->
        <div class="text-center mt-3 pt-3 border-top">
          <a routerLink="/login" class="text-decoration-none small text-muted fw-semibold">
            Nazad na prijavu
          </a>
        </div>

      </div>

    </div>
  </div>
</div>
