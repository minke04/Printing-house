<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      
      <!-- Glavna kartica -->
      <div class="card shadow border-0 rounded-4 p-4 p-md-5 bg-white">
        
        <!-- Naslov i opis -->
        <div class="text-center mb-4">
          <h2 class="h3 fw-bold text-dark">Zaboravljena lozinka</h2>
          <p class="text-muted small">Unesite korisničko ime ili email kako biste dobili link za resetovanje lozinke.</p>
        </div>

        <!-- Obična poruka o uspehu/grešci (prikazuje se samo dok link nije generisan) -->
        @if (message && !resetLink) {
          <div class="alert alert-info rounded-3 p-3 mb-4 shadow-sm" role="alert">
            <div class="small">{{ message }}</div>
          </div>
        }

        <!-- Generisani link za resetovanje -->
        @if (resetLink) {
          <div class="alert alert-warning border border-warning border-opacity-50 rounded-3 p-3 mb-4 shadow-sm">
            <p class="small fw-semibold text-dark mb-1">
              Link je uspešno kreiran (važi 5 minuta):
            </p>
            <a [href]="resetLink" class="text-break small text-decoration-underline text-primary fw-semibold">
              {{ resetLink }}
            </a>
          </div>
        }

        <!-- Forma sa form-floating elementima -->
        <form (submit)="$event.preventDefault(); submit()">
          
          <div class="form-floating mb-3">
            <input 
              type="text" 
              class="form-control rounded-3" 
              id="userInput"
              [(ngModel)]="input" 
              name="input" 
              placeholder="Korisničko ime ili email" 
              required
            >
            <label for="userInput">Korisničko ime ili email</label>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 fw-semibold shadow-sm mb-3">
            Pošalji link za resetovanje
          </button>
        </form>

        <!-- Povratak na prijavu -->
        <div class="text-center mt-3 pt-3 border-top">
          <a routerLink="/login" class="text-decoration-none small text-muted fw-semibold">
            Nazad na prijavu
          </a>
        </div>

      </div>

    </div>
  </div>
</div>
