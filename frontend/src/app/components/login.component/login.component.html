<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      
      <!-- Glavna kartica za prijavu -->
      <div class="card shadow border-0 rounded-4 p-4 p-md-5 bg-white">
        
        <!-- Naslov se menja u zavisnosti od režima (Admin / Regularni korisnik) -->
        <div class="text-center mb-4">
          <div class="mb-3 text-primary">
            <i class="bi" [ngClass]="isAdminMode ? 'bi-shield-lock-fill' : 'bi-person-circle'" style="font-size: 2.5rem;"></i>
          </div>
          <h2 class="h3 fw-bold text-dark">
            {{ isAdminMode ? 'Administratorska prijava' : 'Prijava na sistem' }}
          </h2>
          <p class="text-muted small">Unesite vaše pristupne podatke za nastavak.</p>
        </div>

        <!-- Server poruka o grešci (ukoliko postoji) -->
        @if (message) {
          <div class="alert alert-danger d-flex align-items-center rounded-3 p-3 mb-4" role="alert">
            <i class="bi bi-exclamation-triangle-fill flex-shrink-0 me-2"></i>
            <div class="small">{{ message }}</div>
          </div>
        }

        <!-- Forma za prijavu -->
        <form (submit)="$event.preventDefault(); login()">
          
          <!-- Korisničko ime -->
          <div class="form-floating mb-3">
            <input 
              type="text" 
              class="form-control rounded-3" 
              id="usernameInput"
              [(ngModel)]="username" 
              name="username" 
              placeholder="Korisničko ime"
              required
            >
            <label for="usernameInput">Korisničko ime</label>
          </div>

          <!-- Lozinka -->
          <div class="form-floating mb-4">
            <input 
              type="password" 
              class="form-control rounded-3" 
              id="passwordInput"
              [(ngModel)]="password" 
              name="password" 
              placeholder="Lozinka"
              required
            >
            <label for="passwordInput">Lozinka</label>
          </div>
          
          <!-- Submit dugme -->
          <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 fw-semibold shadow-sm mb-3">
            <i class="bi bi-box-arrow-in-right me-2"></i>
            {{ isAdminMode ? 'Prijavi se kao administrator' : 'Prijavi se' }}
          </button>
        </form>

        <!-- Dodatni linkovi i prebacivanje režima -->
        <div class="text-center mt-3 pt-3 border-top">
          @if (!isAdminMode) {
            <p class="mb-3 small">
              <a routerLink="/forgot-password" class="text-decoration-none text-primary fw-semibold me-2">Zaboravili ste lozinku?</a> 
              <span class="text-muted">&bull;</span>
              <a routerLink="/register" class="text-decoration-none text-primary fw-semibold ms-2">Otvorite nalog</a>
            </p>
          }

          <!-- Dugme za prebacivanje režima (Regularni / Admin) -->
          <button (click)="isAdminMode = !isAdminMode" class="btn btn-outline-secondary btn-sm w-100 rounded-pill py-2">
            <i class="bi bi-arrow-repeat me-1"></i>
            {{ isAdminMode ? 'Pređi na regularnu prijavu' : 'Pređi na administratorsku prijavu' }}
          </button>
        </div>

      </div>

    </div>
  </div>
</div>
